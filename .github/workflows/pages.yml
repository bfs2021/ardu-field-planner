name: pages

on:
  push:
    branches: [ main ]
    paths: [ "web-stable/**", ".github/workflows/pages.yml", ".github/pyodide.sha256" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # New cache name per deploy, otherwise the service worker keeps serving the old app.js
      - name: Stamp service-worker cache
        run: |
          sed -i -E "s/(const SHELL_CACHE = \"[^\"]+)\"/\1-${GITHUB_SHA::7}\"/" web-stable/sw.js
          grep -q "SHELL_CACHE = \".*-${GITHUB_SHA::7}\"" web-stable/sw.js
      # Pyodide (~27 MB) is not in git; without it the web app can't build a route.
      # Pinned to 0.26.4, the same files the APK bundles, checked against .github/pyodide.sha256.
      - name: Add Pyodide runtime
        run: |
          mkdir -p web-stable/pyodide
          cd web-stable/pyodide
          for f in $(awk '{print $2}' ../../.github/pyodide.sha256); do
            curl -sfL --retry 3 -o "$f" "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/$f"
          done
          sha256sum -c ../../.github/pyodide.sha256
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-stable
      - id: deployment
        uses: actions/deploy-pages@v4
